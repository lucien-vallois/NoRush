# Mosquitto MQTT Broker Configuration for Flowback IoT Platform
# Based on Eclipse Mosquitto 2.0 configuration

# Basic Configuration
listener 1883
protocol mqtt

# WebSocket support
listener 9001
protocol websockets

# Security
allow_anonymous true
# password_file /mosquitto/config/password.txt
# acl_file /mosquitto/config/acl.txt

# Persistence
persistence true
persistence_location /mosquitto/data/
autosave_interval 1800
autosave_on_changes false

# Logging (stdout avoids file permission issues on the mounted log volume)
log_dest stdout
log_type error
log_type warning
log_type notice
log_type information
log_type debug
log_timestamp true
log_timestamp_format %Y-%m-%dT%H:%M:%S

# Connection settings
# NOTE: keepalive_interval is a bridge-only option (requires a `connection`
# block) and is rejected at top-level by Mosquitto 2.x, so it is not used here.
max_keepalive 300
max_packet_size 268435455
max_inflight_messages 20
max_queued_messages 1000

# Bridge settings (optional - for connecting to other brokers)
# connection bridge-01
# address broker.example.com:1883
# topic sensors/# out 1 "" ""
# topic commands/# in 1 "" ""

# QoS and Message settings
queue_qos0_messages false
max_queued_bytes 0
upgrade_outgoing_qos false

# System topic settings
sys_interval 10
# $SYS/broker/bytes/#
# $SYS/broker/clients/#
# $SYS/broker/messages/#
# $SYS/broker/publish/#
# $SYS/broker/subscriptions/#
# $SYS/broker/uptime
# $SYS/broker/version

# Performance tuning
max_connections -1
socket_domain ipv4

# TLS/SSL (uncomment to enable)
# listener 8883
# cafile /mosquitto/config/ca.crt
# certfile /mosquitto/config/server.crt
# keyfile /mosquitto/config/server.key
# require_certificate false
# use_identity_as_username false

# HTTP API (for management - optional)
# listener 8080
# protocol http
# http_dir /mosquitto/http/

# Advanced settings
memory_limit 0
# NOTE: store_clean_interval was removed in Mosquitto 2.x (unknown variable).
check_retain_source true
retain_available true
set_tcp_nodelay true
